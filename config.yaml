server:
  project_name: "pay-pipeline - Agentic Commerce & Revenue Growth Engine"
  api_v1_str: "/api/v1"
  host: "0.0.0.0"
  port: 8000

database:
  db_url: "sqlite:///./pay_pipeline.db"

# provider_mode: "simulator" (safe offline test simulator) or "razorpay" (live/test REST API)
payment:
  provider_mode: "simulator"
  razorpay_key_id: null
  razorpay_key_secret: null
  razorpay_webhook_secret: "pay_pipeline_webhook_secret_default_2026"

audit:
  # HMAC Secret used for signing audit trail entries and hash-chain validation
  hmac_secret: "pay_pipeline_audit_hmac_secret_default_2026"

# provider: "deterministic" (offline rule-based intent/catalog routing) or "groq" (LLM-powered)
llm:
  provider: "deterministic"
  groq_api_key: null
  groq_model: "openai/gpt-oss-20b"
  groq_max_tool_rounds: 4
  # Allow Groq model to perform external browser search (catalog price/inventory remain authoritative)
  enable_groq_browser_search: true

search:
  provider: "tavily"
  tavily_api_key: null
  max_search_results: 5

guardrails:
  max_transaction_amount_inr: 5000.0       # Hard ceiling per single transaction (₹5,000)
  max_cumulative_spend_inr: 15000.0        # Cumulative session ceiling (₹15,000)
  approval_threshold_inr: 3000.0           # Orders exceeding ₹3,000 require human 2FA approval
  max_item_quantity: 5                     # Maximum allowed quantity per item SKU
  allowed_currency: "INR"
  allowed_categories:
    - "smartphones"
    - "mobile_accessories"
    - "mechanical_keyboards"
    - "computer_peripherals"
    - "workspace_accessories"
    - "developer_gear"
    - "ergonomics"
    - "audio_equipment"
    - "nutrition_and_fitness"
    - "running_shoes"
    - "health_and_groceries"

# Merchant Storefront Metadata
merchant:
  merchant_id: "merch_pay_pipeline_01"
  merchant_name: "pay-pipeline Store"
