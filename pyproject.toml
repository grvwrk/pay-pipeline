[project]
name = "pay-pipeline"
version = "0.1.0"
description = "pay-pipeline - Agentic Commerce & Revenue Growth Engine"
readme = "README.md"
authors = [
    { name = "Gourav Sahu", email = "plutoe.info@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "llama-index-core>=0.12,<1.0",
    "groq>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
    "pytest>=7.0,<9.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0,<3.0",
    "bs4>=0.0.2",
]

[project.scripts]
pay-pipeline = "pay_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
